on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install Dependencies
        run: pnpm i --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"
      - name: Deploy
        uses: actions/deploy-pages@v4
